# OpenBao access for the namespace dev. ESO logs in as the ServiceAccount
# "openbao" (Kubernetes auth, role "dev", audience "openbao") and can read
# only kv/dev/* (policy "dev-read" in OpenBao).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: dev
---
# OpenBao checks the login token with the TokenReview API, and uses the token
# of the caller for it (disable_local_ca_jwt). That needs system:auth-delegator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: dev
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: dev
spec:
  provider:
    vault:
      server: https://192.168.0.30:8200
      path: kv
      version: v2
      # The public CA certificate of OpenBao (homelab-openbao-ca, valid to 2036).
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: dev
          serviceAccountRef:
            name: openbao
            # OpenBao checks the role audience "openbao". It also sends this same
            # token to the k3s API for the TokenReview, so the token must be valid
            # for the API audiences too.
            audiences:
              - openbao
              - https://kubernetes.default.svc.cluster.local
              - k3s
