# Dev on the tailnet: https://hello-api-dev.lab.munkcloud.dk
# Traefik serves the wildcard certificate from its TLSStore.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: hello-api-dev.lab.munkcloud.dk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-api
                port:
                  name: http
