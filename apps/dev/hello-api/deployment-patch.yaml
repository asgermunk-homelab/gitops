apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api
spec:
  template:
    spec:
      containers:
        - name: hello-api
          image: ghcr.io/asgermunk-homelab/hello-api:9-647e478e-1791898778-dev # {"$imagepolicy": "flux-system:hello-api-dev"}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=dev
