apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api
spec:
  template:
    spec:
      containers:
        - name: hello-api
          image: ghcr.io/asgermunk-homelab/hello-api:11-905683c9-1791899562-prod # {"$imagepolicy": "flux-system:hello-api-prod"}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=prod
