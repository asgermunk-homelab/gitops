# OpenBao access for the namespace cert-manager. ESO logs in as the ServiceAccount
# "openbao" (Kubernetes auth, role "cert-manager", audience "openbao") and can read
# only kv/cert-manager/* (policy "cert-manager-read" in OpenBao).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: cert-manager
---
# OpenBao checks the login token with the TokenReview API, and uses the token
# of the caller for it (disable_local_ca_jwt). That needs system:auth-delegator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: cert-manager
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: cert-manager
spec:
  provider:
    vault:
      server: https://192.168.0.30:8200
      path: kv
      version: v2
      # The public CA certificate of OpenBao (homelab-openbao-ca, valid to 2036).
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: cert-manager
          serviceAccountRef:
            name: openbao
            audiences:
              - openbao
---
# Replaces the hand-made Secret. The value is in OpenBao: kv/cert-manager/cloudflare
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cert-manager/cloudflare
        property: api-token
