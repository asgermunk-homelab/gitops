# One wildcard certificate for all the tailnet names. Thus the Certificate
# Transparency logs show only "*.lab.munkcloud.dk", not each service name.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-lab-munkcloud-dk
  namespace: kube-system
spec:
  secretName: wildcard-lab-munkcloud-dk-tls
  dnsNames:
    - "*.lab.munkcloud.dk"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
