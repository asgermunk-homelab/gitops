# The Tailscale operator publishes Traefik on the tailnet as "traefik".
# The DNS record *.lab.munkcloud.dk points to its Tailscale IP (DNS only).
# k3s still publishes Traefik on the LAN (192.168.0.20) with its own Service.
apiVersion: v1
kind: Service
metadata:
  name: traefik-tailnet
  namespace: kube-system
  annotations:
    tailscale.com/hostname: traefik
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: websecure
      port: 443
      targetPort: websecure
