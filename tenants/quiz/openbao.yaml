# Same pattern as the other namespaces: a service account "openbao" that
# OpenBao's Kubernetes auth checks (role "quiz", policy: read kv/quiz/*).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: quiz
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-quiz
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: quiz
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: quiz
spec:
  provider:
    vault:
      server: https://192.168.0.30:8200
      path: kv
      version: v2
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: quiz
          serviceAccountRef:
            name: openbao
            audiences:
              - openbao
              - https://kubernetes.default.svc.cluster.local
              - k3s
---
# The read-write deploy key for 6-sem-musik-quiz/gitops (Flux reads the repo,
# and the image automation pushes tag updates). In OpenBao at
# kv/quiz/flux-deploy-key with the properties identity, identity.pub, known_hosts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quiz-gitops-deploy-key
  namespace: quiz
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: quiz-gitops-deploy-key
  dataFrom:
    - extract:
        key: quiz/flux-deploy-key
