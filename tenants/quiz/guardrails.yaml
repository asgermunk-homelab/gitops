# Caps for the whole namespace, so the quiz cannot starve Flux, Grafana or
# the rest of the homelab. The k3s VM has ~20 GB RAM; this gives the quiz 4-6.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quiz
  namespace: quiz
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 6Gi
    pods: "30"
    persistentvolumeclaims: "10"
    requests.storage: 30Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
# Defaults for a container that sets no resources (the quota requires them).
apiVersion: v1
kind: LimitRange
metadata:
  name: quiz
  namespace: quiz
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 256Mi
