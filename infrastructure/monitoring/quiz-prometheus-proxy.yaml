# The Prometheus of the Quiz org in Grafana. prom-label-proxy adds
# namespace="quiz" to every PromQL query (and to the label and series APIs),
# so the quiz team cannot see the metrics of other namespaces.
# OTLP metrics get the label "namespace" from Alloy (alloy.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-prometheus-proxy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: quiz-prometheus-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quiz-prometheus-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quiz-prometheus-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prom-label-proxy
          image: quay.io/prometheuscommunity/prom-label-proxy:v0.16.2
          args:
            - -insecure-listen-address=0.0.0.0:8080
            - -upstream=http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            - -label=namespace
            - -label-value=quiz
            - -enable-label-apis
            # Grafana asks for the Prometheus version. It holds no metrics.
            - -unsafe-passthrough-paths=/api/v1/status/buildinfo
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-prometheus-proxy
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: quiz-prometheus-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
