# The Helm repository of the community Grafana charts (Loki, Tempo).
# Grafana moved these charts from grafana.github.io in 2026.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://grafana-community.github.io/helm-charts
---
# Loki keeps the logs. The apps send them over OTLP, through Alloy.
# Monolithic mode: one pod, the chunks and the index on a local PVC.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: 18.15.1
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: Monolithic
    loki:
      # One tenant. No X-Scope-OrgID header is necessary.
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2026-10-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 168h
        # OTLP attributes that are not labels go into the structured metadata,
        # for example trace_id and span_id.
        allow_structured_metadata: true
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      analytics:
        reporting_enabled: false

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    # Off: the scalable components, the memcached caches (they request GBs of RAM),
    # the nginx gateway, the canary and the Helm test.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    gateway:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false

    monitoring:
      serviceMonitor:
        enabled: true
