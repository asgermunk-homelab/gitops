apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
# kube-prometheus-stack: Prometheus, Grafana, kube-state-metrics, node-exporter
# and the standard Kubernetes dashboards. No alerting (Alertmanager is off).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.3.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    # The chart does not update its CRDs by itself.
    crds: CreateReplace
    remediation:
      retries: 3
  # The chart has no switch for the multi-cluster dashboard. The homelab has one cluster.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: kube-prometheus-stack-k8s-resources-multicluster
            patch: |
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: kube-prometheus-stack-k8s-resources-multicluster
  values:
    alertmanager:
      enabled: false

    # k3s runs the controller manager, the scheduler and kube-proxy inside one
    # process, and uses SQLite, not etcd. These targets would show as down.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        alertmanager: false
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        windows: false

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    prometheus:
      prometheusSpec:
        retention: 14d
        # Prometheus deletes the oldest data first when it reaches this size.
        retentionSize: 8GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        # Also scrape the ServiceMonitors and PodMonitors of other charts and apps,
        # not only the ones with the label of this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        # Alloy sends the app metrics here over OTLP (/api/v1/otlp).
        enableOTLPReceiver: true
        otlp:
          # These resource attributes become labels on each app metric.
          promoteResourceAttributes:
            - deployment.environment.name
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            # Set by Alloy from k8s.namespace.name. The quiz proxy filters on it.
            - namespace
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1536Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    # Only Linux. This also removes the AIX and the macOS dashboards.
    nodeExporter:
      operatingSystems:
        aix:
          enabled: false
        darwin:
          enabled: false

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    grafana:
      # Infinity: a data source for HTTP/GraphQL APIs. The Quiz org uses it for
      # Cloudflare's analytics API (CDN panels, SCRUM-125).
      plugins:
        - yesoreyeram-infinity-datasource@4.1.6
      # The Cloudflare token for that data source (openbao.yaml). Optional, so
      # Grafana still starts if the token is missing; the CDN panels then fail.
      envValueFrom:
        CF_ANALYTICS_TOKEN:
          secretKeyRef:
            name: cloudflare-analytics
            key: api-token
            optional: true
      # The Secret comes from OpenBao (openbao.yaml).
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # Keeps the dashboards that you make in the UI. The standard dashboards
      # come from ConfigMaps of the chart.
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
      grafana.ini:
        server:
          root_url: https://grafana.lab.munkcloud.dk
        analytics:
          reporting_enabled: false
          check_for_updates: false
        # The sidecar writes each dashboard ConfigMap to /tmp/dashboards.
        dashboards:
          default_home_dashboard_path: /tmp/dashboards/homelab-overview.json
        # The tailnet name for the quiz team (grafana-tailnet.yaml). The Tailscale
        # proxy changes the Host header, so Grafana must trust this Origin.
        security:
          csrf_trusted_origins: grafana-quiz.tail5a1bc5.ts.net
      # Two orgs. "Main Org." (1) is the homelab and sees everything. "Quiz" (2)
      # is for the quiz team: its data sources only return the namespace quiz.
      # Grafana OSS has no per-user data source permissions, so the org is the wall.
      # The org and the user "quiz" are made by hand (the API), not here:
      # provisioning fails when the org does not exist.
      # Loki and Tempo. The links let you go from a trace to its logs, and back.
      # Both are multi-tenant: X-Scope-OrgID picks the tenant(s).
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          secureJsonData:
            httpHeaderValue1: homelab|quiz
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            derivedFields:
              - name: Trace
                matcherType: label
                matcherRegex: trace_id
                datasourceUid: tempo
                url: "$${__value.raw}"
                urlDisplayLabel: Open the trace
        - name: Tempo
          uid: tempo
          type: tempo
          url: http://tempo.monitoring.svc.cluster.local:3200
          secureJsonData:
            httpHeaderValue1: homelab|quiz
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            tracesToLogsV2:
              datasourceUid: loki
              filterByTraceID: true
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              tags:
                - key: service.name
                  value: service_name
            lokiSearch:
              datasourceUid: loki
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true
        # The Quiz org (orgId 2): only the namespace quiz.
        - name: Prometheus
          uid: quiz-prometheus
          orgId: 2
          type: prometheus
          isDefault: true
          # prom-label-proxy adds namespace="quiz" to every query.
          url: http://quiz-prometheus-proxy.monitoring.svc.cluster.local:8080
          jsonData:
            prometheusType: Prometheus
        - name: Loki
          uid: quiz-loki
          orgId: 2
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          secureJsonData:
            httpHeaderValue1: quiz
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            derivedFields:
              - name: Trace
                matcherType: label
                matcherRegex: trace_id
                datasourceUid: quiz-tempo
                url: "$${__value.raw}"
                urlDisplayLabel: Open the trace
        - name: Tempo
          uid: quiz-tempo
          orgId: 2
          type: tempo
          url: http://tempo.monitoring.svc.cluster.local:3200
          secureJsonData:
            httpHeaderValue1: quiz
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            tracesToLogsV2:
              datasourceUid: quiz-loki
              filterByTraceID: true
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              tags:
                - key: service.name
                  value: service_name
            lokiSearch:
              datasourceUid: quiz-loki
            nodeGraph:
              enabled: true
        # Cloudflare analytics for media.munkcloud.dk (the CDN in front of Garage).
        # The token can only read analytics of the zone munkcloud.dk, and the data
        # source may only call api.cloudflare.com.
        - name: Cloudflare
          uid: quiz-cloudflare
          orgId: 2
          type: yesoreyeram-infinity-datasource
          jsonData:
            auth_method: bearerToken
            allowedHosts:
              - https://api.cloudflare.com
          secureJsonData:
            bearerToken: ${CF_ANALYTICS_TOKEN}
      # The dashboards of the Quiz org. The sidecar can only load into org 1,
      # so these use a normal provider. The ConfigMap is in kustomization.yaml.
      dashboardProviders:
        quiz-providers.yaml:
          apiVersion: 1
          providers:
            - name: quiz
              orgId: 2
              folder: Quiz
              type: file
              disableDeletion: true
              allowUiUpdates: false
              options:
                path: /var/lib/grafana/dashboards/quiz
      dashboardsConfigMaps:
        quiz: dashboard-quiz-overview
      # Tailnet only. The wildcard certificate *.lab.munkcloud.dk covers the name.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - grafana.lab.munkcloud.dk
      # 512Mi was too low: the OOM killer stopped Grafana on 2026-10-13.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
