apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - openbao.yaml
  - release.yaml
# Own dashboards. The Grafana sidecar loads each ConfigMap with the label
# grafana_dashboard: "1". Change a dashboard here, not in the UI.
configMapGenerator:
  - name: dashboard-homelab-overview
    namespace: monitoring
    files:
      - dashboards/homelab-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
